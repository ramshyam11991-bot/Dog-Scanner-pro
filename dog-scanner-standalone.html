<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Dog Scanner</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap');

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: #F1ECDD;
    color: #24261F;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 2.5rem 1.5rem;
  }
  .wrap { width: 100%; max-width: 480px; }
  .eyebrow { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.35rem; font-size: 0.78rem; letter-spacing: 0.03em; color: #6B6A5E; }
  h1 { font-family: 'Fraunces', serif; font-weight: 500; font-size: 2.1rem; margin: 0 0 0.4rem; line-height: 1.15; }
  .sub { font-size: 0.95rem; color: #5B5A4F; margin: 0 0 1.75rem; line-height: 1.5; }

  .dropzone {
    border: 1.5px dashed #A9A491;
    border-radius: 6px;
    padding: 2.5rem 1.5rem;
    text-align: center;
    background: rgba(255,255,255,0.35);
  }
  .dropzone svg { margin: 0 auto 0.9rem; display: block; }
  .dropzone p { font-size: 0.9rem; color: #5B5A4F; margin: 0 0 1.25rem; }
  .btn-row { display: flex; gap: 0.6rem; justify-content: center; flex-wrap: wrap; }

  .btn {
    font-family: 'Inter', sans-serif;
    border: 1.5px solid #2F4B3C;
    background: transparent;
    color: #2F4B3C;
    padding: 0.65rem 1.1rem;
    border-radius: 3px;
    font-size: 0.88rem;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    cursor: pointer;
  }
  .btn:hover { background: rgba(47,75,60,0.08); }
  .btn-primary { background: #2F4B3C; color: #F1ECDD; }
  .btn-primary:hover { background: #26402F; }
  .btn:disabled { opacity: 0.7; cursor: default; }

  .preview-card { border: 1px solid #D8D2C0; border-radius: 6px; overflow: hidden; background: #fff; display: none; }
  .preview-card img { width: 100%; max-height: 320px; object-fit: cover; display: block; }
  .preview-actions { padding: 1rem 1.1rem; display: flex; gap: 0.6rem; flex-wrap: wrap; }

  .error-box {
    margin-top: 1rem; padding: 0.9rem 1rem; border: 1px solid #C97B5F; border-radius: 6px;
    background: rgba(201,123,95,0.1); display: none; gap: 0.6rem; font-size: 0.85rem; color: #7A3B24;
  }

  .result-card { margin-top: 1.25rem; border: 1px solid #D8D2C0; border-radius: 6px; background: #fff; padding: 1.5rem; display: none; }
  .label-small { font-size: 0.72rem; letter-spacing: 0.03em; color: #8B8A7C; margin: 0 0 0.3rem; }
  .breed-name { font-family: 'Fraunces', serif; font-weight: 500; font-size: 1.55rem; margin: 0 0 1.1rem; }
  .conf-row { margin-bottom: 0.55rem; }
  .conf-row .top { display: flex; justify-content: space-between; font-size: 0.82rem; margin-bottom: 0.25rem; }
  .conf-row .top span:last-child { color: #8B8A7C; }
  .conf-bar-bg { height: 4px; background: #EDE8D9; border-radius: 2px; }
  .conf-bar-fill { height: 100%; background: #C08829; border-radius: 2px; }
  .section { margin-top: 1.4rem; }
  ul.notes { margin: 0; padding-left: 1.1rem; font-size: 0.88rem; line-height: 1.6; }
  .disclaimer { margin-top: 1.4rem; padding-top: 1rem; border-top: 1px solid #EDE8D9; font-size: 0.78rem; color: #8B8A7C; line-height: 1.5; }

  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg);} to { transform: rotate(360deg);} }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C08829" stroke-width="1.75"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
    Field notes, no. 01
  </div>
  <h1>The dog scanner</h1>
  <p class="sub">Photograph a dog and get a breed read and a few gentle observations, written up like a naturalist's notebook entry.</p>

  <div class="dropzone" id="dropzone">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#8FA88C" stroke-width="1.5"><path d="M4 4h4l2-2h4l2 2h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><circle cx="12" cy="13" r="3"/></svg>
    <p>No specimen yet. Take a photo or upload one to begin.</p>
    <div class="btn-row">
      <button class="btn btn-primary" id="cameraBtn">📷 Take photo</button>
      <button class="btn" id="uploadBtn">⬆ Upload photo</button>
    </div>
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none" />
    <input type="file" id="uploadInput" accept="image/*" style="display:none" />
  </div>

  <div class="preview-card" id="previewCard">
    <img id="previewImg" src="" alt="Uploaded dog" />
    <div class="preview-actions">
      <button class="btn btn-primary" id="scanBtn">🐾 Identify this dog</button>
      <button class="btn" id="resetBtn">↺ Start over</button>
    </div>
  </div>

  <div class="error-box" id="errorBox"></div>

  <div class="result-card" id="resultCard"></div>
</div>

<script>
  // ⬇️ आपकी Gemini API key — याद रखें, ये public हो जाएगी जब आप ये file host करेंगे।
  const GEMINI_API_KEY = "AQ.Ab8RN6LYBXyDhDo3ABpL3Fa2_s253GNid-V4o7_jCs_I2dm_LA";
  const GEMINI_MODEL = "gemini-flash-latest";

  const dropzone = document.getElementById('dropzone');
  const previewCard = document.getElementById('previewCard');
  const previewImg = document.getElementById('previewImg');
  const errorBox = document.getElementById('errorBox');
  const resultCard = document.getElementById('resultCard');
  const scanBtn = document.getElementById('scanBtn');
  const resetBtn = document.getElementById('resetBtn');

  let currentImage = null; // { dataUrl, mediaType }

  document.getElementById('cameraBtn').onclick = () => document.getElementById('cameraInput').click();
  document.getElementById('uploadBtn').onclick = () => document.getElementById('uploadInput').click();
  document.getElementById('cameraInput').onchange = e => handleFile(e.target.files[0]);
  document.getElementById('uploadInput').onchange = e => handleFile(e.target.files[0]);
  resetBtn.onclick = reset;
  scanBtn.onclick = scan;

  function handleFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      currentImage = { dataUrl: reader.result, mediaType: file.type };
      previewImg.src = currentImage.dataUrl;
      dropzone.style.display = 'none';
      previewCard.style.display = 'block';
      errorBox.style.display = 'none';
      resultCard.style.display = 'none';
      scanBtn.style.display = 'inline-flex';
      scanBtn.disabled = false;
      scanBtn.innerHTML = '🐾 Identify this dog';
    };
    reader.readAsDataURL(file);
  }

  function reset() {
    currentImage = null;
    dropzone.style.display = 'block';
    previewCard.style.display = 'none';
    errorBox.style.display = 'none';
    resultCard.style.display = 'none';
  }

  async function scan() {
    if (!currentImage) return;
    scanBtn.disabled = true;
    scanBtn.innerHTML = '<span class="spin">⏳</span> Reading the coat, stance, ears...';
    errorBox.style.display = 'none';
    resultCard.style.display = 'none';

    try {
      const base64 = currentImage.dataUrl.split(',')[1];
      const promptText = `You are a field-guide style dog identification assistant. Look at the photo and respond with ONLY a raw JSON object, no markdown fences, no preamble, matching exactly this shape:
{"isDog": true, "breedGuesses": [{"name": "string", "confidence": "high|medium|low"}], "characteristics": ["string", "string", "string"], "healthObservations": ["string", "string"], "disclaimer": "string"}
Rules: breedGuesses should list 1-3 plausible breeds or mixes, most likely first. characteristics should be 3-5 short observed physical traits (coat, build, ears, tail, size impression) written like field-guide notes. healthObservations should be 2-4 short, purely observational notes about visible coat condition, body condition, posture, eyes, or skin - phrased cautiously and never a diagnosis. disclaimer should be one sentence stating this is not veterinary advice and a vet should be consulted for any health concerns. If the photo does not contain a dog, set isDog to false, leave breedGuesses and healthObservations as empty arrays, and put a brief note in characteristics explaining what you see instead.`;

      const response = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent`,
        {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-goog-api-key': GEMINI_API_KEY,
          },
          body: JSON.stringify({
            contents: [{
              parts: [
                { inline_data: { mime_type: currentImage.mediaType, data: base64 } },
                { text: promptText }
              ]
            }]
          })
        }
      );

      const data = await response.json();
      if (data.error) throw new Error(data.error.message || 'Gemini API error');

      const textOut = data.candidates && data.candidates[0] && data.candidates[0].content.parts[0].text;
      if (!textOut) throw new Error('No response text received.');

      const cleaned = textOut.replace(/```json|```/g, '').trim();
      const result = JSON.parse(cleaned);
      renderResult(result);
    } catch (err) {
      errorBox.style.display = 'flex';
      errorBox.textContent = "Couldn't read that photo: " + (err.message || 'unknown error') + ". Try again with a clearer shot of the dog.";
      scanBtn.disabled = false;
      scanBtn.innerHTML = '🐾 Identify this dog';
    }
  }

  const confidenceWidth = { high: '85%', medium: '55%', low: '28%' };

  function renderResult(result) {
    scanBtn.style.display = 'none';
    resultCard.style.display = 'block';

    if (result.isDog === false) {
      resultCard.innerHTML = `<p style="font-size:0.92rem; line-height:1.6;">${(result.characteristics && result.characteristics[0]) || "That doesn't look like a dog to me — try another photo."}</p>`;
      return;
    }

    let html = `<p class="label-small">Best guess</p><h2 class="breed-name">${(result.breedGuesses && result.breedGuesses[0] && result.breedGuesses[0].name) || 'Unclear'}</h2>`;

    (result.breedGuesses || []).forEach(b => {
      const width = confidenceWidth[b.confidence] || '40%';
      html += `<div class="conf-row">
        <div class="top"><span>${b.name}</span><span>${b.confidence}</span></div>
        <div class="conf-bar-bg"><div class="conf-bar-fill" style="width:${width}"></div></div>
      </div>`;
    });

    if (result.characteristics && result.characteristics.length) {
      html += `<div class="section"><p class="label-small">Field notes</p><ul class="notes">`;
      result.characteristics.forEach(c => html += `<li>${c}</li>`);
      html += `</ul></div>`;
    }

    if (result.healthObservations && result.healthObservations.length) {
      html += `<div class="section"><p class="label-small">Visible condition notes</p><ul class="notes">`;
      result.healthObservations.forEach(h => html += `<li>${h}</li>`);
      html += `</ul></div>`;
    }

    html += `<p class="disclaimer">${result.disclaimer || 'This is not veterinary advice. Please consult a vet for any health concerns.'}</p>`;
    resultCard.innerHTML = html;
  }
</script>
</body>
</html>
